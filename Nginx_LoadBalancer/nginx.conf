events { worker_connections 1024; }

http {
    upstream gateway_backend {
        # 'api-gateway' is the service name in docker-compose
        # Docker's internal DNS will automatically round-robin requests 
        # to all replicas of the api-gateway service
        server api-gateway:4000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
