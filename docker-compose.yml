version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: load_balancer
    ports:
      - "80:80"
    volumes:
      - ./Nginx_LoadBalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: ./APIGateway_microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      REGISTRATION_URL: http://registration-service:5001
      LOGIN_URL: http://login-service:5002
      ORDER_URL: http://order-service:5005
      TRACKING_URL: http://inventory-service:5004
      PRODUCT_URL: http://catalog-service:5003
      INBOUND_URL: http://inbound-service:5006
      USER_URL: http://tracking-service:5007

  login-service:
    container_name: login_microservice
    build:
      context: ./Login_microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: production
      PORT: 5002

  registration-service:
    container_name: registration_microservice
    build:
      context: ./Registration_microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001

  catalog-service:
    container_name: catalog_microservice
    build:
      context: ./Catalog_microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      NODE_ENV: production
      PORT: 5003

  inventory-service:
    container_name: inventory_microservice
    build:
      context: ./Inventory_microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      NODE_ENV: production
      PORT: 5004

  order-service:
    container_name: order_microservice
    build:
      context: ./Order_microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      NODE_ENV: production
      PORT: 5005

  inbound-service:
    container_name: inbound_microservice
    build:
      context: ./Inbound_microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      NODE_ENV: production
      PORT: 5006

  tracking-service:
    container_name: tracking_microservice
    build:
      context: ./Tracking_microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5007:5007"
    environment:
      NODE_ENV: production
      PORT: 5007
